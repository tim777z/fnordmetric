# Ephemeral database services for running the C++ backend tests in isolation.
# Usage: docker compose -f docker-compose.test.yml up -d && make test
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fnordmetric_test
      POSTGRES_PASSWORD: fnordmetric_test
      POSTGRES_DB: fnordmetric_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnordmetric_test -d fnordmetric_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: fnordmetric_test
      MYSQL_DATABASE: fnordmetric_test
      MYSQL_USER: fnordmetric_test
      MYSQL_PASSWORD: fnordmetric_test
    ports:
      - "33306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufnordmetric_test", "-pfnordmetric_test"]
      interval: 5s
      timeout: 5s
      retries: 20